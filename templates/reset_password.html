<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAM System | Reset Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <style>
        .masked-email {
            text-align: center;
            margin-bottom: 25px;
            font-size: 15px;
            color: #444;
        }
        .masked-email .email-icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            vertical-align: middle;
            margin-right: 6px;
            position: relative;
            top: -1px;
        }
        .masked-email .email-icon svg {
            width: 20px;
            height: 20px;
            fill: #0b6efd;
            vertical-align: middle;
        }
        .masked-email strong {
            color: #222;
        }
        .password-hint {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card">

        <h1>Enterprise Asset Management</h1>
        <p class="subtitle">Reset Your Password</p>

        {% if masked_email %}
        <div class="masked-email">
            <span class="email-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
            </span>
            Resetting password for <strong>{{ masked_email }}</strong>
        </div>
        {% endif %}

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="/reset-password/{{ token }}">

            <label>New Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter new password"
                minlength="8"
                required
            >

            <label>Confirm New Password</label>
            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm new password"
                minlength="8"
                required
            >

            <p class="password-hint">
                Minimum 8 characters with uppercase, lowercase, digit &amp; special character.
            </p>

            <button type="submit">
                Update Password
            </button>

        </form>

        <div class="bottom-text">
            <a href="/login">Back to Login</a>
        </div>

    </div>

</div>

</body>
</html>
