<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAM System | Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <style>
        .info-text {
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .message {
            background: #e6f9ee;
            color: #1a7a3a;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }
        .btn-disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card">

        <h1>Enterprise Asset Management</h1>
        <p class="subtitle">Reset Your Password</p>

        <p class="info-text">
            Enter your registered email address and we'll send you a link to reset your password.
        </p>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <form method="POST" action="/forgot-password" id="resetForm">

            <label>Email Address</label>
            <input
                type="email"
                name="email"
                placeholder="Enter your registered email"
                required
                value="{{ request.form.get('email', '') }}"
            >

            <button type="submit" id="resetBtn">
                Send Reset Link
            </button>

        </form>

        <div class="bottom-text">
            <a href="/login">Back to Login</a>
        </div>

    </div>

</div>

</body>
</html>
