<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDMH EAM | Password Updated</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <style>
        .success-box {
            text-align: center;
            padding: 10px 0 0;
        }
        .success-box .checkmark {
            display: inline-block;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #e6f9ee;
            margin-bottom: 18px;
            line-height: 60px;
        }
        .success-box .checkmark svg {
            width: 32px;
            height: 32px;
            fill: #1a7a3a;
            vertical-align: middle;
            position: relative;
            top: 2px;
        }
        .success-box h2 {
            color: #1a7a3a;
            margin-bottom: 12px;
            font-size: 20px;
        }
        .success-box p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .success-box .redirect-msg {
            color: #888;
            font-size: 13px;
            margin-top: 18px;
        }
        .success-box .btn-login {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 30px;
            background: #0b6efd;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
        }
        .success-box .btn-login:hover {
            background: #084ec5;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card">

        <h1>Enterprise Asset Management</h1>

        <div class="success-box">
            <div class="checkmark">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
            </div>
            <h2>Password Updated Successfully</h2>
            <p>
                Your password has been changed successfully.<br>
                You can now sign in using your new password.
            </p>
            <a href="/login" class="btn-login">Go to Login</a>
            <p class="redirect-msg">Redirecting to Login...</p>
        </div>

    </div>

</div>

<script>
    setTimeout(function() {
        window.location.href = '/login';
    }, 3000);
</script>

</body>
</html>
