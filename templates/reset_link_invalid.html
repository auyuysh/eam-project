<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDMH EAM | Invalid Reset Link</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <style>
        .error-box {
            text-align: center;
            padding: 10px 0 0;
        }
        .error-box .icon {
            display: inline-block;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #fff3e0;
            margin-bottom: 18px;
            line-height: 60px;
        }
        .error-box .icon svg {
            width: 32px;
            height: 32px;
            fill: #e65100;
            vertical-align: middle;
            position: relative;
            top: 2px;
        }
        .error-box h2 {
            color: #e65100;
            margin-bottom: 12px;
            font-size: 20px;
        }
        .error-box p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .error-box .btn-reset {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 30px;
            background: #0b6efd;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
        }
        .error-box .btn-reset:hover {
            background: #084ec5;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card">

        <h1>Enterprise Asset Management</h1>

        <div class="error-box">
            <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
            </div>
            <h2>Invalid or Expired Reset Link</h2>
            <p>
                This password reset link is no longer valid. It may have expired or already been used.
            </p>
            <a href="/forgot-password" class="btn-reset">Request New Reset Link</a>
            <p style="margin-top: 18px;">
                <a href="/login" style="color: #0b6efd;">Back to Login</a>
            </p>
        </div>

    </div>

</div>

</body>
</html>
